<!DOCTYPE html>
<html>
	<h1>School Personnel Record</h1>
	<table>
		<tr>
			<td>Full Name</td>
			<td>Screen Name</td>
			<td>Identity</td>
		</tr>
		{% for i in records %}
			<tr>
				<td>{{ i[0] }}</td>
				<td>{{ i[1] }}</td>
				<td>{{ i[2] }}</td>
			</tr>
		{% endfor %}
	</table>
</html>
